run:
  t_max: 30000
  seed: 22

eval:
  episode: 30


globals:
  cpu_clock_cycle: 3.8 # Used to convert detection latency to cycle
  cpu_cores: 8
  fps: 5
  decision_interval: 300

  ids:
    latency_ms: 0.0357 #0.357
    cycles_ms: 0.0

  attack_sampler:
    n_types: 10
    dirichlet_alpha: 0.2  # symmetric Dirichlet concentration over edges per type; higher=uniform, lower=concentrated on one edge
    pattern_types: ["sinus", "pw", "expo"]
    lambda_base:      [7000, 7000]   # flows/sec
    noise_std:        [0.05, 0.10]
    t_cycle_min:      [300, 500]     # seconds (lower bound on cycle duration)
    t_cycle_delta:    [300, 800]     # seconds added to t_min to get t_max
    latency_per_flow: [0.01, 0.02]   # ms per flow
    bw_per_flow:      [0.0, 0.0]     # Mbps per flow
    non_defendable_bw_const: 0.0

  reward:
    alpha_inv: 5.0   # QoE shortfall normalizer        (alpha = 1/alpha_inv = 10)
    beta_inv:  2.5   # Attack residual normalizer       (beta  = 1/beta_inv  =  5)
    gamma_inv: 15    # Benign collateral normalizer     (gamma = 1/gamma_inv ≈ 8.33)
    q_th:      0.20  # QoE shortfall threshold

  # SP2 Phase 1: Accuracy-Aware Inspection Offloading
  # Matrices are |E|×|E|; row = source edge index, col = target edge index.
  # Order matches edge_areas list: E1=row/col 0, E2=row/col 1.
  sp2_fnr_matrix:
    - [0.10, 0.15]   # traffic from E1 inspected at: [E1, E2]
    - [0.15, 0.10]   # traffic from E2 inspected at: [E1, E2]

  sp2_fpr_matrix:
    - [0.05, 0.10]
    - [0.10, 0.05]

  # [omega_1, omega_2, omega_3, omega_4] = [FNR weight, FPR weight, prop_delay weight, util weight]
  sp2_weights: [1.0, 1.0, 0.01, 1.0]

  # Propagation delay matrix in ms: row=source edge index, col=target edge index.
  # Order matches edge_areas list: E1=0, E2=1. Diagonal must be 0.
  # - Campus LAN: 1–5 ms                                                                                                                                                                                                                   
  # - City-scale (intersection to intersection): 5–20 ms                                                                                                                                                                                   
  # - Metro area / across districts: 20–50 ms     
  delay_ms:
    - [0.0, 30.0]
    - [30.0, 0.0]

  video_pipeline:
    reid_latency: 20 #! Should consider batch processing

    configs:
      - detector: nanoDet-m
        map: 0.235 #Highest map for this detector
        latency_ms:
          detection: 4.05
        cycles:
          detection: 0
        res_to_acc:
        - base_resolution_h: 412
          map: 0.235
        - base_resolution_h: 320
          map: 0.206
        - base_resolution_h: 224
          map: 0.179

      - detector: nanoDet-plus-m
        map: 0.304
        latency_ms:
          detection: 6.55
        cycles:
          detection: 0
        res_to_acc:
        - base_resolution_h: 412
          map: 0.304
        - base_resolution_h: 320
          map: 0.27
        - base_resolution_h: 224
          map: 0.25

      - detector: nanoDet-plus-m-1.5x
        map: 0.341
        latency_ms:
          detection: 10.17
        cycles:
          detection: 0
        res_to_acc:
        - base_resolution_h: 412
          map: 0.341
        - base_resolution_h: 320
          map: 0.299
        - base_resolution_h: 224
          map: 0.27



edge_areas:
  - area_id: "E1"
    cpu_cycle_per_ms: 3.8 #3.8GHz #3.8E6 / ms
    slo_beta: 3.0
    slo_threshold: 0.2
    budget: { cpu: 8.0, mem: 8.0, uplink: 100 } #100Mbps
    constraints:
      D_Max: 250.0
      MOTA_min: 0.1
      Gamma: 0.0005

    dirichlet_concentration: 1.0  # Dirichlet alpha for P(a|e); 1.0 = uniform over attack types

    ids_config:
      accuracy_by_type:
        #! Explicitly set to 0 for training
        default: [0.00, 0.00]   # single global [FPR, FNR] applied to all attack types

    users:
      - user_id: 0
        synthetic:
          rw_sigma_per_sqrt_sec: 1.2
          mu_min: 20.0
          mu_max: 200.0
          kappa: 0.25
          sigma: 8

    attackers:
      - attacker_type: "atk_01"

  - area_id: "E2"
    cpu_cycle_per_ms: 3.8 #3.8GHz #3.8E6 / ms
    slo_beta: 3.0
    slo_threshold: 0.2
    budget: { cpu: 8.0, mem: 8.0, uplink: 100 } #100Mbps
    constraints:
      D_Max: 250.0
      MOTA_min: 0.1
      Gamma: 0.0005

    dirichlet_concentration: 1.0  # Dirichlet alpha for P(a|e); 1.0 = uniform over attack types

    ids_config:
      accuracy_by_type:
        #! Explicitly set to 0 for training
        default: [0.00, 0.00]   # single global [FPR, FNR] applied to all attack types

    users:
      - user_id: 0
        synthetic:
          rw_sigma_per_sqrt_sec: 1.2
          mu_min: 20.0
          mu_max: 200.0
          kappa: 0.25
          sigma: 8

    attackers:
      - attacker_type: "atk_01"