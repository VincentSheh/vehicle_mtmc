run:
  t_max: 30000
  seed: 22

eval:
  episode: 30


globals:
  cpu_clock_cycle: 3.8 # Used to convert detection latency to cycle
  cpu_cores: 8
  fps: 5
  decision_interval: 300

  ids:
    latency_ms: 0.0357 #0.357
    cycles_ms: 0.0

  attack_sampler:
    n_types: 10
    dirichlet_alpha: 0.2  # symmetric Dirichlet concentration over edges per type; higher=uniform, lower=concentrated on one edge
    pattern_types: ["sinus", "pw", "expo" ] #, "yoyo"]
    # pattern_types: ["pw"]
    # pattern_types: ["yoyo"]
    level: "default"
    lambda_level:
      default: [14000, 18000]
      low: [5000, 10000]
      mid: [12000, 16000]
      high: [18000, 24000]
    noise_std:        [0.05, 0.10]
    t_cycle_min:      [300, 500]     # seconds (lower bound on cycle duration)
    t_cycle_delta:    [300, 800]   # seconds added to t_min to get t_max
    latency_per_flow: [2,4]      # ms per flow  (latency_per_flow * 1000 * va_cpu / lambda_base)
    bw_per_flow:      [0.0, 0.0]   # Mbps per flow
    # bw_per_flow:      [0.15, 0.30]   # Mbps per flow
    non_defendable_bw_const: 0.0
  
  user_sampler:
    synthetic:
      level: "default"
      rw_sigma_per_sqrt_sec: 1.2      
      kappa: 0.25 
      sigma: 8 # Before Conversion to per step request = 0.9
      mu_level:
        default: [20.0, 200.0]
        low: [10.0, 100.0]
        mid: [30.0, 150.0]
        high: [50.0, 250.0]

  reward:
    alpha_inv: 11.0   # QoE shortfall normalizer   
    beta_inv:  1.0   # Attack residual normalizer  
    gamma_inv: 10.0   # Benign collateral normalizer
    q_th:      0.35   # QoE shortfall threshold

  # Offload mode comparison:
  #
  #  Mode            Function                  N_star target          Offload trigger              Routing strategy                  Delay-aware  Accuracy-aware
  #  --------------- ------------------------- --------------------- ---------------------------- --------------------------------- ------------ --------------
  #  none            no_offload                —                     never                        all traffic stays local           no           no
  #  balance         balance_workload          c[e] * W_tot / C_tot  always (any imbalance)       greedy, random receiver order     no           no
  #  delay_workload  score_based_offload       c[e] * W_tot / C_tot  always (any imbalance)       proportional to inverse delay     yes          no
  #  full            score_based_offload       c[e] * W_tot / C_tot  always (any imbalance)       proportional to delay + accuracy  yes          yes
  #  cto             balance_workload_cto      c[e]  (absolute)      only when W[e] > c[e]        greedy, sorted ascending delay    yes          no
  #  cto_acc         balance_workload_cto_acc  c[e]  (absolute)      only when W[e] > c[e]        greedy, sorted by delay+accuracy  yes          yes
  #
  #  All modes: capacity in pkts/slot (IDS) and tasks/slot (VA); balance caps receivers at c[e].
  #  delay_workload vs cto: same trigger/target but delay_workload splits supply proportionally
  #  across receivers by score whereas cto fills the closest receiver first (winner-takes-all).
  offload_mode: "cto_acc"  # "none" | "balance" | "delay_workload" | "full" | "cto" | "cto_acc"
  # VA-stage attack offload mode:
  #   false (default) — admitted attacks stay at their IDS executor; VA capacity is
  #                     pre-reduced by attack load before the benign-user offload plan.
  #   true            — attacks are offloaded together with benign users; VA capacity
  #                     is offered at full value and attack resource consumption is
  #                     distributed across VA executors after routing.
  va_attack_offload: true
  max_prop_delay_ms: 50.0        # hard delay cutoff for modes delay_workload / full

  # Score-based offload weights (modes delay_workload / full)
  #   score(src,dst) = load_benefit - d_prop/d_max * w3
  #                  + (FNR_local - FNR_remote) * w1   [full only]
  #                  + (FPR_local - FPR_remote) * w2   [full only]
  #                  + (util_src  - util_dst)   * w4   [full only]
  offload_weights:
    w1: 1.0   # FNR accuracy improvement
    w2: 1.0   # FPR accuracy improvement
    w3: 0.010  # propagation delay penalty (ms⁻¹); non-zero so delay_workload has a routing criterion

  # Accuracy-by-region matrix: [src_edge_idx][exec_edge_idx] = [FPR, FNR]
  # Row = traffic source edge, Col = inspecting/executing edge.
  # Diagonal = local inspection (own model on own traffic).
  # Designed so delay_workload and full route to different edges:
  #   E2: close (5 ms) but high FPR (0.45) for non-local traffic  — delay_workload prefers it
  #   E3: far  (30 ms) but low  FPR (0.01) for non-local traffic  — full prefers it
  # Routing criterion for E1 traffic (w3=0.010, w2=1.0):
  #   delay_workload: score(→E2) = -0.05  >  score(→E3) = -0.30   →  routes to E2  (bad FPR)
  #   full:           raw(→E2)  = -0.40  <   raw(→E3)  = -0.21   →  routes to E3  (good FPR)
  accuracy_by_region:
    - [[0.10, 0.00], [0.45, 0.00], [0.01, 0.00]]   # traffic from E1: inspected at [E1, E2, E3]
    - [[0.20, 0.00], [0.10, 0.00], [0.01, 0.00]]   # traffic from E2: inspected at [E1, E2, E3]
    - [[0.20, 0.00], [0.45, 0.00], [0.10, 0.00]]   # traffic from E3: inspected at [E1, E2, E3]

  # Propagation delay matrix in ms: row=source edge index, col=target edge index.
  # Order matches edge_areas list: E1=0, E2=1, E3=2. Diagonal must be 0.
  # - Campus LAN: 1–5 ms
  # - City-scale (intersection to intersection): 5–20 ms
  # - Metro area / across districts: 20–50 ms
  delay_ms:
    # Asymmetric: E2 is close (5 ms), E3 is far (30 ms from E1).
    # delay_workload prefers E2 (lower delay penalty); full overrides to E3 (accuracy wins).
    - [0.0,   5.0,  30.0]
    - [5.0,   0.0,  25.0]
    - [30.0, 25.0,   0.0]

  video_pipeline:
    reid_latency: 20 #! Should consider batch processing

    configs:
      - detector: nanoDet-m
        map: 0.235 #Highest map for this detector
        latency_ms:
          detection: 4.05
        cycles:
          detection: 0
        res_to_acc:
        - base_resolution_h: 412
          map: 0.235
        - base_resolution_h: 320
          map: 0.206
        - base_resolution_h: 224
          map: 0.179

      - detector: nanoDet-plus-m
        map: 0.304
        latency_ms:
          detection: 6.55
        cycles:
          detection: 0
        res_to_acc:
        - base_resolution_h: 412
          map: 0.304
        - base_resolution_h: 320
          map: 0.27
        - base_resolution_h: 224
          map: 0.25

      - detector: nanoDet-plus-m-1.5x
        map: 0.341
        latency_ms:
          detection: 10.17
        cycles:
          detection: 0
        res_to_acc:
        - base_resolution_h: 412
          map: 0.341
        - base_resolution_h: 320
          map: 0.299
        - base_resolution_h: 224
          map: 0.27



edge_areas:
  - area_id: "E1"
    cpu_cycle_per_ms: 3.8 #3.8GHz #3.8E6 / ms
    slo_beta: 3.0
    slo_threshold: 0.2
    budget: { cpu: 8.0, mem: 8.0, uplink: 100 } #100Mbps
    constraints:
      D_Max: 250.0
      MOTA_min: 0.1
      Gamma: 0.0005

    dirichlet_concentration: 1.0  # Dirichlet alpha for P(a|e); 1.0 = uniform over attack types


  - area_id: "E2"
    cpu_cycle_per_ms: 3.8 #3.8GHz #3.8E6 / ms
    slo_beta: 3.0
    slo_threshold: 0.2
    budget: { cpu: 8.0, mem: 8.0, uplink: 100 } #100Mbps
    constraints:
      D_Max: 250.0
      MOTA_min: 0.1
      Gamma: 0.0005

    dirichlet_concentration: 1.0  # Dirichlet alpha for P(a|e); 1.0 = uniform over attack types


  - area_id: "E3"
    cpu_cycle_per_ms: 3.8 #3.8GHz #3.8E6 / ms
    slo_beta: 3.0
    slo_threshold: 0.2
    budget: { cpu: 8.0, mem: 8.0, uplink: 100 } #100Mbps
    constraints:
      D_Max: 250.0
      MOTA_min: 0.1
      Gamma: 0.0005

    dirichlet_concentration: 1.0  # Dirichlet alpha for P(a|e); 1.0 = uniform over attack types
